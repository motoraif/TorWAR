<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TorWARTA Setup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .setup-container { min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .setup-card { background: rgba(255,255,255,0.95); border-radius: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .step { display: none; } .step.active { display: block; }
        .progress-bar { transition: width 0.5s ease; }
        .btn-primary { background: linear-gradient(45deg, #667eea, #764ba2); border: none; }
    </style>
</head>
<body>
    <div class="setup-container d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="setup-card p-5">
                        <div class="progress mb-4">
                            <div class="progress-bar" id="progressBar" style="width: 25%"></div>
                        </div>
                        
                        <div class="step active" id="step1">
                            <h2 class="text-center mb-4">Welcome to TorWARTA</h2>
                            <p class="text-center text-muted mb-4">Let's set up your AWS Well-Architected Review tool</p>
                            <div class="text-center">
                                <button class="btn btn-primary btn-lg" onclick="nextStep()">Get Started</button>
                            </div>
                        </div>
                        
                        <div class="step" id="step2">
                            <h3 class="mb-4">Create Admin Account</h3>
                            <form id="adminForm">
                                <div class="mb-3">
                                    <input type="text" class="form-control" id="username" placeholder="Username" required>
                                </div>
                                <div class="mb-3">
                                    <input type="email" class="form-control" id="email" placeholder="Email" required>
                                </div>
                                <div class="mb-3">
                                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Create Account</button>
                            </form>
                        </div>
                        
                        <div class="step" id="step3">
                            <h3 class="text-center mb-4">Installing...</h3>
                            <div class="text-center">
                                <div class="spinner-border text-primary mb-3"></div>
                                <p id="installStatus">Setting up database...</p>
                            </div>
                        </div>
                        
                        <div class="step" id="step4">
                            <h3 class="text-center mb-4">Setup Complete!</h3>
                            <p class="text-center text-muted mb-4">TorWARTA is ready to use</p>
                            <div class="text-center">
                                <button class="btn btn-success btn-lg" onclick="completeSetup()">Continue to Application</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 1;
        
        function nextStep() {
            if (currentStep < 4) {
                document.getElementById(`step${currentStep}`).classList.remove('active');
                currentStep++;
                document.getElementById(`step${currentStep}`).classList.add('active');
                document.getElementById('progressBar').style.width = `${currentStep * 25}%`;
                
                if (currentStep === 3) {
                    setTimeout(() => nextStep(), 2000);
                }
            }
        }
        
        document.getElementById('adminForm').onsubmit = function(e) {
            e.preventDefault();
            const data = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            
            fetch('/setup_admin', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            }).then(() => nextStep());
        };
        
        function completeSetup() {
            fetch('/complete_setup', {method: 'POST'})
            .then(() => window.location.href = '/');
        }
    </script>
</body>
</html>
