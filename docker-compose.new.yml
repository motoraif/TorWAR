version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: torwar_db
      POSTGRES_USER: torwar
      POSTGRES_PASSWORD: torwar123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  torwar:
    build:
      context: .
      dockerfile: Dockerfile.new
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql://torwar:torwar123@db:5432/torwar_db
      - SECRET_KEY=torwar-production-secret-key-change-me
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./instance:/app/instance
      - ~/.aws:/root/.aws:ro
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
